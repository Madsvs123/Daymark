[project]
name = "daymark"
version = "1.0.0"
description = "Local CLI timer for the operator's own work."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Madsvs123" }]
keywords = ["time-tracking", "cli", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daymark = "daymark.cli:console_main"

[project.urls]
Homepage = "https://github.com/Madsvs123/Daymark"
Repository = "https://github.com/Madsvs123/Daymark"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
